<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Arima:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="auth.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Arima', cursive;
    }

    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url('https://github.com/theofficialVajer/uploadforkknight/blob/main/Orange%20Yellow%20Artistic%20Scenery.jpg?raw=true')
        no-repeat center/cover;
      animation: floatBackground 12s ease-in-out infinite alternate;
      color: #fff;
      overflow: hidden;
    }

    @keyframes floatBackground {
      0% { background-position: center; }
      100% { background-position: center 20px; }
    }

    .glass-box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: popIn 0.8s ease forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 2em;
      margin-bottom: 20px;
      font-weight: 600;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #ffcc70, #ff884b);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(255, 204, 112, 0.6);
    }
  </style>
</head>
<body onload="checkAuth()">
  <div class="glass-box">
    <h1 id="welcomeText">Welcome!</h1>
    <button onclick="logout()">Logout</button>
  </div>

  <link rel="stylesheet" href="rightclick.css">
<script src="rightclick.js"></script>

</body>
</html>
